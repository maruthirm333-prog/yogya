<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yogya — The right person for the right work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#4326D9;--primary-deep:#2B1A8F;--purple:#7C4DFF;--lavender:#EFEBFF;--soft-purple:#DCD3FF;--lime:#BDF23D;--lime-deep:#8FC414;--green:#16A35A;--green-soft:#E1F6E9;--amber:#D98A00;--amber-soft:#FFF1CF;--red:#D93A40;--red-soft:#FDE7E8;--bg:#FAF7F0;--surface:#FFFFFF;--surface-2:#F3EFE6;--ink:#0D1233;--ink-2:#4B5170;--ink-3:#7C819F;--line:#E9E4D9;--glass:rgba(250,247,240,.8);--shadow:0 1px 2px rgba(20,16,60,.05),0 10px 30px rgba(45,30,140,.08);--shadow-lg:0 24px 60px rgba(45,30,140,.22);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#7F62FF;--primary-deep:#3B2BB0;--purple:#9B7BFF;--lavender:#221D5C;--soft-purple:#3A2F8F;--green:#3DD483;--green-soft:#12351F;--amber:#F5B733;--amber-soft:#3A2D0C;--red:#FF7378;--red-soft:#3A1519;--bg:#0B0E22;--surface:#151A3A;--surface-2:#1C2249;--ink:#F1F2FF;--ink-2:#B4B8DA;--ink-3:#8086B0;--line:#262D5C;--glass:rgba(11,14,34,.8);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--primary:#7F62FF;--primary-deep:#3B2BB0;--purple:#9B7BFF;--lavender:#221D5C;--soft-purple:#3A2F8F;--green:#3DD483;--green-soft:#12351F;--amber:#F5B733;--amber-soft:#3A2D0C;--red:#FF7378;--red-soft:#3A1519;--bg:#0B0E22;--surface:#151A3A;--surface-2:#1C2249;--ink:#F1F2FF;--ink-2:#B4B8DA;--ink-3:#8086B0;--line:#262D5C;--glass:rgba(11,14,34,.8);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px;-webkit-font-smoothing:antialiased;min-height:100vh;background-image:radial-gradient(900px 400px at 85% -100px,color-mix(in srgb,var(--purple) 14%,transparent),transparent),radial-gradient(700px 300px at -10% 0,color-mix(in srgb,var(--lime) 16%,transparent),transparent);background-repeat:no-repeat}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,.disp{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em;line-height:1.08;font-weight:700}
h1{font-size:clamp(32px,6vw,58px);font-weight:800}
.h1{font-size:clamp(26px,4.4vw,38px)}
h2{font-size:clamp(22px,3.4vw,30px)}
h3{font-size:18px;line-height:1.2}
h4{font-size:15px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
main{padding-top:18px;padding-bottom:110px;min-height:70vh;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
section{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h a{font-weight:700;color:var(--primary);font-size:14px}
.muted{color:var(--ink-2)}.small{font-size:13px;color:var(--ink-3)}
/* header */
.hdr{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;max-width:1120px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:.02em}
.logo i{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--purple));display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px;position:relative}
.logo i:after{content:'';position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--lime);border:2px solid var(--bg)}
.nav{display:none;gap:4px;margin-left:10px}
.nav a{padding:8px 12px;border-radius:999px;font-weight:600;color:var(--ink-2);font-size:14.5px;white-space:nowrap}
.nav a.on,.nav a:hover{background:var(--lavender);color:var(--primary)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.iconbtn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn .dot{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.locbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;order:3;width:100%}
.mode button{flex:1;white-space:nowrap;border:0;background:none;padding:10px 12px;border-radius:999px;font-weight:700;color:var(--ink-2);cursor:pointer;font-size:14px;transition:background .2s,color .2s}
.mode button.on{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(67,38,217,.3)}
@media(min-width:1000px){.nav{display:flex}.mode{order:0;width:auto;margin-left:6px}.mode button{padding:9px 16px}.hdr-r{margin-left:0}.hdr-in{flex-wrap:nowrap}.hdr-in .spacer{flex:1}}
.spacer{display:none}@media(min-width:1000px){.spacer{display:block}}
/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--ink-3);padding:4px 0;position:relative;min-height:48px;justify-content:center}
.bnav a.on{color:var(--primary)}
.bnav a.fab span.ic{background:linear-gradient(135deg,var(--primary),var(--purple));color:#fff;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;margin-top:-22px;box-shadow:0 10px 22px rgba(67,38,217,.35)}
.bnav .cnt{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
@media(min-width:1000px){.bnav{display:none}main{padding-bottom:60px}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;cursor:pointer;min-height:46px;transition:transform .12s,box-shadow .2s,background .2s;text-align:center;line-height:1.1}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--purple));color:#fff;box-shadow:0 8px 20px rgba(67,38,217,.28)}
.btn-primary:hover{box-shadow:0 10px 26px rgba(67,38,217,.4)}
.btn-lime{background:var(--lime);color:#0D1233;box-shadow:0 8px 20px rgba(143,196,20,.35)}
.btn-soft{background:var(--lavender);color:var(--primary)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost.on-dark{border-color:rgba(255,255,255,.4);color:#fff}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-ok{background:var(--green);color:#fff}
.btn-sm{padding:8px 15px;min-height:38px;font-size:13.5px}
.btn-lg{padding:16px 28px;font-size:17px;min-height:56px}
.btn-block{width:100%}
.btn[disabled],.btn.off{opacity:.5;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns.two>*{flex:1 1 150px}
/* cards */
.card{background:var(--surface);border-radius:26px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.card[data-nav]{cursor:pointer}.card[data-nav]:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.grid.g2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}.row.sb{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;background:var(--lavender);color:var(--primary);white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}.pill.amber{background:var(--amber-soft);color:var(--amber)}.pill.red{background:var(--red-soft);color:var(--red)}.pill.gray{background:var(--surface-2);color:var(--ink-2)}.pill.lime{background:var(--lime);color:#0D1233}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2);margin-top:10px}
.meta b{color:var(--ink)}
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex:none;font-family:'Bricolage Grotesque',sans-serif}
.ci{width:46px;height:46px;border-radius:16px;background:var(--lavender);display:grid;place-items:center;font-size:23px;flex:none}
.vt{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;vertical-align:2px}
/* worker card */
.wc-top{display:flex;align-items:center;gap:12px}.wc-id{flex:1;min-width:0}.wc-id p{color:var(--ink-2);font-size:14px}
.wc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.ring{position:relative;display:grid;place-items:center;flex:none}.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--lavender);stroke-width:6}.ring-fg{fill:none;stroke:var(--green);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring b{font-family:'Bricolage Grotesque',sans-serif;font-size:14px;position:relative}
.jc-h{display:flex;gap:12px;align-items:center}.jc-h>div{flex:1;min-width:0}.jc-h p{color:var(--ink-2);font-size:14px}
.jc-f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.prog{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--lime-deep),var(--lime));border-radius:9px;transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;background:linear-gradient(140deg,#2B1A8F 0%,#4326D9 58%,#6A3DF0 100%);color:#fff;border-radius:34px;padding:26px 20px;overflow:hidden;position:relative;box-shadow:var(--shadow-lg)}
.hero p.lead{font-size:17px;color:rgba(255,255,255,.86);max-width:520px;margin-top:14px}
.hero .q{font-weight:700;margin:22px 0 8px;font-size:15px;color:rgba(255,255,255,.9)}
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;color:#0D1233;border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.searchbar input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;padding:10px 4px;color:#0D1233}
.searchbar input::placeholder{color:#7C819F}
.searchbar.flat{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}.searchbar.flat input{color:var(--ink)}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.map{position:relative;border-radius:28px;overflow:hidden;min-height:300px;background:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/40px 40px,radial-gradient(circle at 50% 50%,rgba(189,242,61,.22),transparent 60%),rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16)}
.map svg.roads{position:absolute;inset:0;width:100%;height:100%}
.you{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 6px rgba(189,242,61,.3);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(189,242,61,.6)}100%{box-shadow:0 0 0 30px rgba(189,242,61,0)}}
.pin{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--lime);display:block;box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .2s}
.pin:hover{transform:translate(-50%,-50%) scale(1.15);z-index:3}
.pin.busy{border-color:#F5B733}.pin.unavailable{border-color:#aaa}
.fchip{position:absolute;background:rgba(255,255,255,.92);color:#0D1233;font-weight:800;font-size:12px;padding:7px 12px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.25);white-space:nowrap}
.fchip.c1{left:14px;bottom:16px}.fchip.c2{right:14px;top:16px}
@media(min-width:900px){.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);padding:44px;align-items:center}.map{min-height:400px}}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cat{min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 6px;text-align:center;font-weight:700;font-size:12px;cursor:pointer;transition:transform .15s,border-color .2s,background .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.cat:hover{transform:translateY(-3px);border-color:var(--purple)}.cat span{font-size:28px}
.cat.on{background:var(--primary);color:#fff;border-color:var(--primary)}
@media(min-width:900px){.cats{grid-template-columns:repeat(8,minmax(0,1fr))}}
.steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.step{padding:20px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}.step .ci{margin-bottom:12px}.step p{color:var(--ink-2);margin-top:6px;font-size:15px}
/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label,.lbl{font-weight:700;font-size:14px}
.field small{color:var(--ink-3)}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;outline:0;font-size:16px;min-height:50px;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--purple);box-shadow:0 0 0 4px color-mix(in srgb,var(--purple) 20%,transparent)}
textarea.input{min-height:110px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:inline-flex;align-items:center;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;transition:all .15s;min-height:42px}
.seg input:checked+span{background:var(--primary);border-color:var(--primary);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--purple);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
.stepper input{width:80px;text-align:center}
.form{max-width:640px}
.err{color:var(--red);font-weight:600;font-size:14px;margin:-6px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer;min-height:38px}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.tabs{display:flex;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px;overflow-x:auto;margin:16px 0}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:10px 14px;font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-size:14px}
.tabs button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
/* misc blocks */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:700;font-size:14px;margin-bottom:12px}
.ph-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:28px;line-height:1.1}.stat span{font-size:13px;color:var(--ink-2)}
.stat.hi{background:linear-gradient(135deg,var(--primary),var(--purple));color:#fff;border:0}.stat.hi span{color:rgba(255,255,255,.85)}
.empty{text-align:center;padding:44px 20px;background:var(--surface);border:1.5px dashed var(--line);border-radius:28px}
.empty .big{width:84px;height:84px;border-radius:50%;background:var(--lavender);display:grid;place-items:center;font-size:40px;margin:0 auto 14px}
.empty p{color:var(--ink-2);margin:6px 0 18px}
.banner{border-radius:20px;padding:14px 16px;background:var(--amber-soft);color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.info{background:var(--lavender)}.banner.ok{background:var(--green-soft)}.banner.bad{background:var(--red-soft)}
.success{text-align:center;padding:36px 20px}
.check{width:92px;height:92px;margin:0 auto 14px}.check circle{fill:var(--green);transform-origin:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}.check path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .3s ease forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv>div{background:var(--surface-2);border-radius:18px;padding:12px 14px}.kv small{display:block;color:var(--ink-3);font-weight:600}.kv b{font-size:16px}
.tl{list-style:none;position:relative;padding-left:4px}
.tl li{display:flex;gap:14px;padding-bottom:18px;position:relative}
.tl li:not(:last-child):before{content:'';position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.tl li.done:not(:last-child):before{background:var(--green)}
.tl i{width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--ink-3);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;flex:none}
.tl li.done i{background:var(--green);color:#fff}.tl li.now i{background:var(--lime);color:#0D1233;box-shadow:0 0 0 5px color-mix(in srgb,var(--lime) 35%,transparent)}
.tl b{display:block;font-size:15px;line-height:1.3}.tl small{color:var(--ink-3)}.tl li:not(.done):not(.now) b{color:var(--ink-3);font-weight:600}
.panel{border-radius:24px;padding:18px;background:var(--lavender);display:flex;gap:14px;align-items:flex-start}
.panel.g{background:var(--green-soft)}.panel.a{background:var(--amber-soft)}
.pulse-dot{width:14px;height:14px;border-radius:50%;background:var(--amber);flex:none;margin-top:6px;animation:pulse2 1.6s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(217,138,0,.5)}100%{box-shadow:0 0 0 14px rgba(217,138,0,0)}}
.route{position:relative;height:8px;border-radius:8px;background:var(--surface-2);margin:14px 0 6px;overflow:hidden}.route i{position:absolute;top:0;height:100%;width:32%;border-radius:8px;background:var(--green);animation:slide 2.2s ease-in-out infinite}
@keyframes slide{0%{left:-32%}100%{left:100%}}

function toast(msg,kind=''){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.setAttribute('aria-live','polite');document.body.appendChild(t)}t.className='toast '+kind+' show';t.textContent=msg;clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2800)}

function readPhoto(file,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const M=640,k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};img.onerror=()=>toast('We could not read that photo. Try another one.','warn');img.src=fr.result};fr.readAsDataURL(file)}

/* ===== search + match (transparent, rule-based — not AI) ===== */
function parseQ(q){q=(q||'').toLowerCase();let category='';for(const c in KW){if(KW[c].some(k=>new RegExp('\\b'+k).test(q))){category=c;break}}
 let when='';if(/today/.test(q))when='today';else if(/tomorrow/.test(q))when='tomorrow';else if(/week/.test(q))when='week';
 const text=q.replace(/near me|nearby|today|tomorrow|this week|for \d+ days?|\bfor\b|\bnear\b|\bme\b|workers?/g,'').replace(/\s+/g,' ').trim();return {category,when,text}}
function matchScore(w,ctx={}){
 const cat=ctx.category,d=ctx.d!=null?ctx.d:distTo(w),rk={today:0,tomorrow:1,week:2};
 const skill=cat?(w.cats[0]===cat?1:w.cats.includes(cat)?.7:0):.85;
 let av;if(w.avail.status==='unavailable')av=0;else if(w.avail.status==='busy')av=.4;else av=ctx.when?(rk[w.avail.when]<=rk[ctx.when]?1:.3):1;
 const dist=Math.max(0,1-d/10),exp=Math.min(w.exp/10,1),rat=Math.max(0,Math.min(1,(w.rating-3)/2)),resp=w.response/100;
 const parts=[['Skill match',skill,40],['Availability',av,20],['Distance',dist,15],['Experience',exp,10],['Rating',rat,10],['Response rate',resp,5]];
 const score=Math.floor(parts.reduce((s,p)=>s+p[1]*p[2],0));
 const reasons=[[skill>=.7,skill>=1?(cat?'Skill matches your request':'Skilled in '+CAT(w.cats[0]).name):skill>=.7?'Has a related skill':'Different primary skill'],
  [av>=1,av>=1?'Available at your requested time':av>0?'Busy \u2014 may not be free at your time':'Currently unavailable'],
  [d<=3,d<=3?'Close to your location ('+d+' km)':'A bit far away ('+d+' km)'],
  [w.rating>=4.5&&w.exp>=5,w.rating>=4.5&&w.exp>=5?'Strong work history ('+w.jobs+' jobs, \u2B50 '+w.rating.toFixed(1)+')':'Newer work history']];
 return {score,parts,reasons}}
const why=m=>`<div class="why"><h4>Why this match?</h4>${m.reasons.map(([ok,t])=>`<p class="${ok?'ok':'warn'}"><i>${ok?'\u2713':'!'}</i>${t}</p>`).join('')}<details><summary>See score breakdown</summary>${m.parts.map(([l,v,wt])=>`<div class="bar"><span>${l} (${wt}%)</span><b style="--w:${Math.round(v*100)}%"></b></div>`).join('')}</details></div>`;
function searchWorkers(f){
 const p=parseQ(f.q),cat=f.cat||p.category;
 let rows=S.workers.map(w=>({w,d:distTo(w)})).filter(({w,d})=>{
  if(cat&&!w.cats.includes(cat))return false;
  if(!cat&&p.text&&!(w.name+' '+w.title+' '+w.skills.join(' ')).toLowerCase().includes(p.text))return false;
  if(f.avail&&w.avail.status!=='available')return false;
  if(f.dist!=='any'&&d>+f.dist)return false;return true});
 rows=rows.map(r=>({...r,m:matchScore(r.w,{category:cat,when:p.when,d:r.d})}));
 const by={match:(a,b)=>b.m.score-a.m.score,distance:(a,b)=>a.d-b.d,experience:(a,b)=>b.w.exp-a.w.exp,rating:(a,b)=>b.w.rating-a.w.rating,price:(a,b)=>(a.w.payMin+a.w.payMax)-(b.w.payMin+b.w.payMax)};
 return {rows:rows.sort(by[f.sort]||by.match),cat}}
function nearJobs(f={}){const p=parseQ(f.q),cat=f.cat||p.category;
 return S.jobs.filter(j=>jobStatus(j)!=='completed').map(j=>({j,d:distTo(j)})).filter(({j,d})=>{
  if(cat&&j.category!==cat)return false;
  if(!cat&&p.text&&!(j.title+' '+j.description).toLowerCase().includes(p.text))return false;
  if(f.dist&&f.dist!=='any'&&d>+f.dist)return false;
  if((f.when||p.when)&&!whenMatch(j.date,f.when||p.when))return false;return true}).sort((a,b)=>a.d-b.d)}

 const d0=new Date().setHours(0,0,0,0),now=Date.now(),pays=S.payments.filter(p=>!p.seed&&(B(p.bookingId)||{}).workerId===w.id);
 pays.forEach(p=>{if(p.ts>=d0){e.today+=p.amount;e.bars[6]+=p.amount}if(p.ts>=now-7*DAY)e.week+=p.amount;if(p.ts>=now-30*DAY)e.month+=p.amount;e.jobs++});
 e.pending+=S.bookings.filter(b=>b.workerId===w.id&&['completed','payment_due'].includes(b.status)).reduce((s,b)=>s+(b.price||0),0);e.pays=pays;return e}

 ${canUp||hasPh?`<section><div class="card"><h3>Photo proof</h3><div class="grid g2" style="margin-top:12px">${photoSlot(b,'before',canUp)}${photoSlot(b,'after',canUp&&b.status==='in_progress')}</div></div></section>`:''}

 'b-start':d=>{const b=B(d.id);setB(b,'in_progress','started');notify('customer',null,`${W(b.workerId).name} has started the job.`,'start','#/booking/'+b.id);done('Work started')},
 'b-complete':d=>{const b=B(d.id);setB(b,'completed','completed');notify('customer',null,`${W(b.workerId).name} marked ${b.title} as completed. Please confirm.`,'done','#/booking/'+b.id);done('Work completed \uD83C\uDF89')},
 'b-confirm':d=>{const b=B(d.id);setB(b,'payment_due');notify('worker',b.workerId,`${uName(b.customerId)} confirmed the work. Payment is next.`,'done','#/booking/'+b.id);save();go('#/pay/'+b.id)},
 'cancel-open':d=>modal(`<h2>${S.mode==='customer'?'Cancel booking':'Cancel job'}?</h2><p class="muted">Tell us why. This helps keep Yogya fair for everyone.</p><div class="radios">${REASONS.map((r,i)=>`<label><input type="radio" name="reason" value="${esc(r)}" ${i===0?'checked':''}>${r}</label>`).join('')}</div><div class="btns two"><button class="btn btn-danger btn-lg" data-action="cancel-confirm" data-id="${d.id}">Yes, cancel</button><button class="btn btn-ghost btn-lg" data-action="close">Keep it</button></div>`),
 'cancel-confirm':d=>{const b=B(d.id),r=$('#modal input[name=reason]:checked');if(!b||!r)return;b.cancel={by:S.mode,reason:r.value,ts:Date.now()};setB(b,'cancelled');if(S.mode==='customer')notify('worker',b.workerId,`${uName(b.customerId)} cancelled ${b.title}.`,'cancel','#/booking/'+b.id);else notify('customer',null,`${W(b.workerId).name} cancelled ${b.title}.`,'cancel','#/booking/'+b.id);done('Booking cancelled')},
 'report-open':d=>modal(`<h2>Report an issue</h2><p class="muted">What went wrong?</p><form data-form="report" data-id="${d.id}"><div class="radios">${ISSUES.map(r=>`<label><input type="radio" name="reason" value="${esc(r)}">${r}</label>`).join('')}</div><div class="field"><label for="rd">Description</label><textarea class="input" id="rd" name="desc" placeholder="Tell us what happened"></textarea></div><div class="field"><label for="rp">Photo (optional)</label><input class="input" id="rp" name="photo" type="file" accept="image/*"></div><p class="err hidden" id="rErr" role="alert">Choose what went wrong.</p><button class="btn btn-primary btn-block" type="submit">Submit Report</button></form>`),
 star:(d,el)=>{REV.r=+d.v;el.parentElement.querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',i<REV.r));el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');const e=$('#rvErr');if(e)e.classList.add('hidden')},
 rtag:(d,el)=>{const i=REV.tags.indexOf(d.tag);if(i<0)REV.tags.push(d.tag);else REV.tags.splice(i,1);el.classList.toggle('on',i<0)},
 'chat-quick':d=>sendMsg(d.id,d.text),
 notif:d=>{const n=S.notifications.find(x=>x.id===d.id);if(!n)return;n.read=true;save();if(n.ref)go(n.ref);else render(true)},
 'read-all':()=>{myNotifs().forEach(n=>{n.read=true});done()},
 'new-worker':()=>{const id=uid('w'),n=S.workers.length;S.workers.push({id,name:'New Worker',title:'Helper',cats:['other'],skills:['General work'],exp:0,rating:4,jobs:0,response:80,onTime:90,completion:90,avail:{status:'available',when:'today'},bio:'Tell customers about your work.',payMin:400,payMax:700,pref:'daily',phone:'',photo:null,verified:false,area:'Hassan Center',x:2.5,y:-.5});S.workerId=id;done('New profile created. Fill in your details.')},
 reset:()=>{if(confirm('Reset all demo data in this browser?')){try{localStorage.removeItem(LS)}catch(e){}S=seed();applyTheme();location.hash='#/';render();toast('Demo reset')}}
};
function sendMsg(id,text){text=(text||'').trim();if(!text)return;const b=B(id);(S.messages[id]=S.messages[id]||[]).push({id:uid('m'),from:S.mode,text,ts:Date.now(),read:false});
 const to=S.mode==='customer'?['worker',b.workerId]:['customer',null];notify(to[0],to[1],`New message about ${b.title}: ${text.slice(0,50)}`,'booking','#/chat/'+id);save();render(true);const i=$('#chatIn');if(i)i.focus()}
const FORMS={
 hsearch:(f,fd)=>go('#/workers?q='+encodeURIComponent((fd.get('q')||'').trim())),
 login:(f,fd)=>{S.loggedIn=true;const p=(fd.get('phone')||'').trim();if(p)S.users[0].phone=p;save();go('#/');toast('Welcome to Yogya')},
 cprofile:(f,fd)=>{S.users[0].name=(fd.get('name')||'').trim()||'Maruthi';S.users[0].phone=(fd.get('phone')||'').trim();done('Profile saved')},
 chat:(f,fd)=>sendMsg(f.dataset.id,fd.get('text')),
 book:(f,fd)=>{const w=W(f.dataset.wid),desc=(fd.get('desc')||'').trim(),pt=fd.get('ptype'),price=Math.round(+fd.get('price'))||0,err=$('#formErr'),bad=m=>{err.textContent=m;err.classList.remove('hidden')};
  if(desc.length<3)return bad('Tell the worker what you need done.');if(pt==='customer'&&price<1)return bad('Enter your budget, or choose Ask for a quote.');
  const date=fd.get('date')==='custom'?(fd.get('cdate')||iso(1)):fd.get('date'),time=fd.get('time')==='custom'?(fd.get('ctime')||'16:00'):fd.get('time');
  const b={id:uid('b'),customerId:'u_me',workerId:w.id,title:desc.slice(0,60),category:fd.get('cat')||w.cats[0],description:desc,date,time,area:S.area,landmark:(fd.get('landmark')||'').trim(),priceType:pt,price:pt==='customer'?price:null,quote:null,status:'requested',recurring:fd.get('rec')||'once',t:{requested:Date.now()},photos:{},note:'',cancel:null,issue:null,eta:null,reviewId:null};
  S.bookings.unshift(b);notify('worker',w.id,`${S.users[0].name} sent you a new work request: ${b.title}.`,'booking','#/booking/'+b.id);save();go('#/booking/'+b.id+'?sent=1')},
 post:(f,fd)=>{const title=(fd.get('title')||'').trim(),pay=Math.round(+fd.get('pay'))||0,err=$('#formErr'),bad=m=>{err.textContent=m;err.classList.remove('hidden')};
  if(title.length<3)return bad('Give your job a short title.');if(pay<1)return bad('Enter the approximate pay per worker.');
  const a=AREAS.find(x=>x.name===fd.get('area'))||area(),date=fd.get('date')==='custom'?(fd.get('cdate')||iso(1)):fd.get('date'),
   j={id:uid('j'),customerId:'u_me',title,category:fd.get('cat'),description:(fd.get('desc')||'').trim()||'No extra details provided.',area:a.name,landmark:(fd.get('landmark')||'').trim(),date,duration:fd.get('dur')||'1 day',workersNeeded:Math.max(1,Math.min(50,parseInt(fd.get('need'),10)||1)),pay:{min:pay,max:pay,unit:'day'},acceptedBy:[],status:'open',createdAt:Date.now(),x:+(a.x+1.4).toFixed(2),y:+(a.y+.7).toFixed(2)};
  S.jobs.unshift(j);save();go('#/post?done='+j.id)},
 quote:(f,fd)=>{const b=B(f.dataset.id),amt=Math.round(+fd.get('amount'))||0;if(amt<1){$('#qErr').classList.remove('hidden');return}
  b.quote={id:uid('q'),bookingId:b.id,workerId:b.workerId,amount:amt,message:(fd.get('message')||'').trim(),eta:(fd.get('eta')||'').trim()||'Not sure yet',status:'sent'};setB(b,'quoted','responded');notify('customer',null,`${W(b.workerId).name} sent a quote of ${inr(amt)}.`,'booking','#/booking/'+b.id);done('Quote sent')},
 report:(f,fd)=>{const r=fd.get('reason');if(!r){$('#rErr').classList.remove('hidden');return}const b=B(f.dataset.id),file=fd.get('photo'),rep={id:uid('t'),bookingId:b.id,reportedBy:'u_me',reason:r,description:(fd.get('desc')||'').trim(),photoName:file&&file.name||'',status:'open',createdAt:Date.now()};
  S.reports.unshift(rep);b.issue=rep.id;save();render(true);$('#modal .modal').innerHTML=`<div class="success">${checkSvg}<h2>Issue Submitted</h2><p class="muted" style="margin:8px 0 18px">Yogya support will review the issue.</p><button class="btn btn-primary btn-block" data-action="close">Close</button></div>`},
 pay:(f,fd)=>{const b=B(f.dataset.id);if(!b||b.status!=='payment_due')return;const amt=b.price,fe=fee(amt);S.payments.push({id:uid('p'),bookingId:b.id,amount:amt,fee:fe,total:amt+fe,method:fd.get('method')||'UPI',status:'success',ts:Date.now()});setB(b,'paid','paid');const w=W(b.workerId);w.jobs++;
  notify('worker',w.id,`Payment received: ${inr(amt)} for ${b.title}.`,'payment','#/booking/'+b.id);notify('customer',null,`Please rate your experience with ${w.name}.`,'review','#/booking/'+b.id);save();go('#/receipt/'+b.id)},
 review:(f,fd)=>{const b=B(f.dataset.id);if(!REV.r){$('#rvErr').classList.remove('hidden');return}const w=W(b.workerId),r={id:uid('r'),bookingId:b.id,workerId:w.id,customerId:'u_me',customerName:S.users[0].name,rating:REV.r,review:(fd.get('review')||'').trim(),tags:REV.tags.slice(),createdAt:Date.now()};
  S.reviews.push(r);b.reviewId=r.id;setB(b,'reviewed','reviewed');w.rating=Math.round(((w.rating*Math.max(0,w.jobs-1)+r.rating)/Math.max(1,w.jobs))*10)/10;notify('worker',w.id,`${S.users[0].name} rated you ${r.rating} stars.`,'review','#/booking/'+b.id);REV={r:0,tags:[]};done('Thanks! Your review is now on '+first(w.name)+'\u2019s profile')},
 wprofile:(f,fd)=>{const w=meW(),err=$('#formErr'),bad=m=>{err.textContent=m;err.classList.remove('hidden')},name=(fd.get('name')||'').trim(),lo=Math.round(+fd.get('pmin'))||0,hi=Math.round(+fd.get('pmax'))||0;
  if(!name)return bad('Add your name.');if(hi<lo)return bad('The highest pay should be at least the lowest pay.');
  const prim=fd.get('primary');if(prim!==w.cats[0])w.title=CAT(prim).noun;w.name=name;w.phone=(fd.get('phone')||'').trim();w.area=fd.get('area');w.cats=[prim,...fd.getAll('others').filter(x=>x!==prim)];
  w.skills=(fd.get('skills')||'').split(',').map(s=>s.trim()).filter(Boolean);w.exp=Math.max(0,parseInt(fd.get('exp'),10)||0);w.bio=(fd.get('bio')||'').trim();w.avail={status:fd.get('st'),when:fd.get('wh')};w.pref=fd.get('pref');w.payMin=lo;w.payMax=hi;done('Profile saved')}
};
const CHANGES={
 'wf-sort':t=>{WF.sort=t.value;paintWF()},'wf-dist':t=>{WF.dist=t.value;paintWF()},'jf-dist':t=>{JF.dist=t.value;paintJF()},
 theme:t=>{S.theme=t.value;applyTheme();save()},
 persona:t=>{S.workerId=t.value;save();render(true);toast('Now acting as '+meW().name)},
 photo:t=>{const f=t.files&&t.files[0];if(!f)return;const b=B(t.dataset.id),k=t.dataset.kind;readPhoto(f,u=>{b.photos[k]=u;save();render(true);toast('Photo added')})},
 wphoto:t=>{const f=t.files&&t.files[0];if(!f)return;readPhoto(f,u=>{meW().photo=u;save();render(true);toast('Photo updated')})},
 'adm-status':t=>{const b=B(t.dataset.id);if(b){b.status=t.value;done('Status updated')}},
 'adm-job':t=>{const j=Jb(t.dataset.id);if(j){j.status=t.value;done('Status updated')}},
 'adm-report':t=>{const r=S.reports.find(x=>x.id===t.dataset.id);if(r){r.status=t.value;done('Status updated')}},
 fee:t=>{const v=Math.max(0,Math.min(30,Math.round(+t.value)||0));S.config.feePct=v;save();toast('Platform fee set to '+v+'%')}
};

/* ===== router & events ===== */
function animate(){requestAnimationFrame(()=>document.querySelectorAll('.ring-fg[data-off]').forEach(c=>{c.style.strokeDashoffset=c.dataset.off}))}
function parse(){const h=(location.hash||'#/').slice(1),[p,q]=h.split('?'),seg=p.split('/').filter(Boolean);return {name:seg[0]||'',id:seg[1],q:new URLSearchParams(q||'')}}
function render(keep){
 const p=parse(),key=location.hash,isNew=key!==LASTKEY;LASTKEY=key;
 if(WROUTES.includes(p.name))S.mode='worker';else if(CROUTES.includes(p.name)||(p.name==='worker'&&!p.q.get('preview')&&S.mode!=='worker'))S.mode='customer';
 if(isNew){REV={r:0,tags:[]};closeModal()}
 AFTER=null;let html;
 try{html=(V[p.name]||notFound)(p,isNew)}catch(err){console.error(err);html='<div class="empty"><div class="big">\uD83D\uDE15</div><h3>Something went wrong</h3><p>Please go back and try again.</p><a class="btn btn-primary" href="#/">Go Home</a></div>';AFTER=null}
 app.innerHTML=shell(html,p.name);animate();if(AFTER)AFTER();if(isNew&&!keep)window.scrollTo(0,0)}
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-action]');
 if(a){const fn=ACTIONS[a.dataset.action];if(fn){fn(a.dataset,a,e)}return}
 if(e.target.closest('a,button,label,input,select,textarea'))return;
 const n=e.target.closest('[data-nav]');if(n)go(n.dataset.nav)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(f,new FormData(f))});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset&&t.dataset.change;if(c&&CHANGES[c])CHANGES[c](t)});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset||{};if(d.live==='wf'){WF.q=t.value;const r=$('#wf-res');if(r){r.innerHTML=wfResults();animate()}}else if(d.live==='jf'){JF.q=t.value;const r=$('#jf-res');if(r)r.innerHTML=jfResults()}else if(d.note!==undefined){const b=B(d.id);if(b){b.note=t.value;save()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.action){e.preventDefault();e.target.click()}});
window.addEventListener('hashchange',()=>render());
applyTheme();render();
window.__yogya={get S(){return S},render,go,ACTIONS,FORMS,CHANGES};
})();

</script>
